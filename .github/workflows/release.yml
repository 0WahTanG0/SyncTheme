# Собирает, подписывает и публикует релиз при пуше тега vX.Y.Z.
# Нужен секрет репозитория SYNCTHEME_KEYS_PASSWORD — пароль от keystore.tar.gz.enc.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unlock signing keys
        env:
          SYNCTHEME_KEYS_PASSWORD: ${{ secrets.SYNCTHEME_KEYS_PASSWORD }}
        run: scripts/keys.sh unlock

      - name: Build, test and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
